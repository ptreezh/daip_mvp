name: CI

on:
  push:
    branches: [main, gnhf/*]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -fsSL https://install.python-poetry.org | python3 -
          poetry --version

      - name: Install dependencies
        run: poetry install --with dev

      - name: Install type stubs
        run: poetry run pip install types-PyYAML types-aiofiles types-Markdown types-requests types-toml

      - name: Check formatting (ruff format)
        run: poetry run ruff format --check src/ tests/

      - name: Run ruff
        run: poetry run ruff check src/ tests/

      - name: Check Python 3.9 syntax compatibility
        run: poetry run python scripts/check_py39_syntax.py

      # mypy: 全库类型化是已记录的 Backlog（917 项，见 .planning/real_state_assessment_2026-08-09.md）。
      # 软门禁：不阻塞 CI，错误数已知且记录在案，Backlog 完成后改回硬门禁。
      - name: Run mypy (soft gate - typing backlog)
        run: poetry run mypy src/daip_live
        continue-on-error: true

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # GitHub runner 无 systemd：显式后台启动 ollama serve
          (ollama serve > /tmp/ollama.log 2>&1 &)
          # 等待服务就绪（最多 30s）
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server ready"
              break
            fi
            sleep 1
          done
          ollama --version
          curl -fsS http://localhost:11434/api/tags || { echo "Ollama failed to start"; cat /tmp/ollama.log; exit 1; }

      - name: Pull models for real-model tests
        run: |
          set -e
          # Retry transient registry 503s from Ollama (upstream network flakiness)
          retry_pull() {
            local model="$1"
            local attempt=0
            until ollama pull "$model"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "::error::Failed to pull $model after 3 attempts"
                exit 1
              fi
              echo "::warning::ollama pull $model attempt $attempt failed, retrying in 5s"
              sleep 5
            done
          }
          retry_pull llama3:latest
          retry_pull nomic-embed-text

      - name: Run full test suite (unit + integration + e2e + security)
        run: poetry run pytest tests/ -q --tb=line
        env:
          OLLAMA_HOST: http://localhost:11434
