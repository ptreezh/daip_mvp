name: Mandatory Rules Check

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main, feature/* ]

jobs:
  mandatory-rules-check:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
    
    - name: Install project
      run: poetry install --no-interaction
    
    - name: Run mandatory rules check
      run: poetry run python mandatory_rules_checker.py
    
    - name: Upload mandatory rules report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: mandatory-rules-report-${{ matrix.python-version }}
        path: mandatory_rules_report.json
    
    - name: Run code quality checks
      run: |
        poetry run black --check src/ tests/
        poetry run ruff check src/ tests/
        poetry run mypy src/
    
    - name: Run tests
      run: |
        poetry run pytest --tb=short -x
    
    - name: Comment on PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('mandatory_rules_report.json', 'utf8'));
          
          const comment = `
          ## 📋 Mandatory Rules Check Results
          
          **Status**: ${report.pass ? '✅ PASS' : '❌ FAIL'}
          **Python Version**: ${{ matrix.python-version }}
          
          ### Summary:
          - Total Violations: ${report.total_violations}
          - Critical Violations: ${report.critical_violations}
          - Warnings: ${report.warnings.length}
          
          ${report.pass ? 
            '✅ All mandatory rules passed! You are ready to merge.' : 
            '❌ Critical violations found. Please fix all issues before merging.'
          }
          
          ${report.violations.length > 0 ? 
            '### Violations:\n' + report.violations.slice(0, 10).map(v => `- **${v.rule}**: ${v.message}`).join('\n') + 
            (report.violations.length > 10 ? '\n... and ' + (report.violations.length - 10) + ' more violations' : '') : 
            ''
          }
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });