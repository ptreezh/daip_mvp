# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

-   repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
    -   id: black

-   repo: https://github.com/pycqa/pylint
    rev: v3.1.0
    hooks:
    -   id: pylint
        args:
        - --rcfile=pyproject.toml
        # You can add more specific paths here if needed, e.g., src/
        files: \.py$

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
    -   id: mypy
        args: [--config-file=pyproject.toml]
        # Exclude files if necessary, e.g., tests/
        exclude: ^(docs/|tests/)

-   repo: local
    hooks:
    -   id: mandatory-rules-check
        name: Mandatory Development Rules Check
        entry: python mandatory_rules_checker.py
        language: system
        pass_filenames: false
        always_run: true
        # This hook will block commits if any mandatory rules are violated
