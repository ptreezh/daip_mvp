database:
  path: daip_live.db
debate:
  logs_directory: knowledge/debate/
knowledge_base:
  directory: knowledge/
llm_provider:
  default_model: ollama/llama3
  embedding_model: ollama/nomic-embed-text
mcp:
  markdownify:
    auth:
      token_env: MCP_MARKDOWNIFY_TOKEN
      type: none
    enabled: true
    endpoint: http://localhost:8081
    timeout_seconds: 15
  permissions:
    allowed_domains:
    - arxiv.org
    - doi.org
    default: ask
  scihub:
    auth:
      token_env: MCP_SCIHUB_TOKEN
      type: none
    enabled: true
    endpoint: http://localhost:8082
    timeout_seconds: 15
paper:
  download_directory: knowledge/paper/
role_manager:
  roles_dir: roles/
wiki:
  pages_directory: knowledge/wiki/
