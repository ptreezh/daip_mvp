version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: daip-postgres
    environment:
      POSTGRES_DB: daip_db
      POSTGRES_USER: daip
      POSTGRES_PASSWORD: daip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - daip-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: daip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - daip-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Ollama LLM 服务
  ollama:
    image: ollama/ollama:latest
    container_name: daip-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - daip-network
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434

  # ChromaDB 向量数据库
  chromadb:
    image: chromadb/chroma:latest
    container_name: daip-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - daip-network
    environment:
      - ALLOW_RESET=TRUE
    restart: unless-stopped

  # DAIP Backend API
  daip-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daip-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - ollama
      - chromadb
    environment:
      - DATABASE_URL=postgresql+asyncpg://daip:daip@postgres:5432/daip_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - VECTOR_STORE_PERSIST_DIRECTORY=/app/data/vector_store
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - daip-network
    restart: unless-stopped

  # Nginx 反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: daip-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - daip-backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - daip-network
    restart: unless-stopped

  # Prometheus 监控 (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: daip-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - daip-network
    restart: unless-stopped

  # Grafana 仪表板 (可选)
  grafana:
    image: grafana/grafana:latest
    container_name: daip-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - daip-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  chroma_data:
  prometheus_data:
  grafana_data:

networks:
  daip-network:
    driver: bridge