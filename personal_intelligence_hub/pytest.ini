[tool:pytest]
# Personal Intelligence Hub - Pytest Configuration

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    asyncio: 异步测试

# 异步测试配置
asyncio_mode = auto

# 覆盖率配置
# 需要安装 pytest-cov: pip install pytest-cov
# --cov=personal_intelligence_hub
# --cov-report=html
# --cov-report=term-missing
# --cov-fail-under=80

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:lona.*