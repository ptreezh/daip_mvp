id: test_protocol
name: 财务报告分析协议
version: "1.0"
description: "用于分析财务报告的自动化协议"
steps:
  - id: step1
    name: 数据预处理
    type: data_processing
    inputs:
      data:
        type: object
        required: true
      operation:
        type: string
        default: "transform"
    outputs:
      processed_data:
        type: object
    timeout: 60
    retry_count: 3

  - id: step2
    name: LLM分析
    type: llm_call
    inputs:
      prompt:
        type: string
        required: true
    dependencies: ["step1"]
    outputs:
      analysis_result:
        type: object
    timeout: 120
    retry_count: 2

  - id: step3
    name: 结果验证
    type: condition
    inputs:
      condition:
        type: string
        default: "contains"
      value:
        type: string
        required: true
      expected:
        type: string
        default: "分析完成"
    dependencies: ["step2"]
    outputs:
      validation_result:
        type: boolean
    timeout: 30
    retry_count: 1

metadata:
  author: "DAIP系统"
  created_at: "2025-01-29"
  category: "financial_analysis"
  tags: ["财务", "分析", "自动化"]
