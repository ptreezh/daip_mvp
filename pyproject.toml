[tool.poetry]
name = "daip-mvp-project"
version = "0.1.0"
description = "DAIP-L.I.V.E. 智能协作平台，支持多AI角色协作与知识管理。"
authors = ["DAIP-LIVE Team"]
readme = "README.md"
package-mode = true

[[tool.poetry.packages]]
from = "."
include = "src"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
langchain = "^0.1.0"
llama-index = "^0.10.0"
ollama = "^0.5.1"
chromadb = "^1.0.13"
pydantic-settings = "^2.2.1"
pydantic = "^2.7.1"
streamlit = "^1.46.1"
psutil = "^7.0.0"
sqlmodel = "^0.0.24"
python-multipart = "^0.0.20"
scikit-learn = "^1.7.0"
matplotlib = "^3.10.3"
pytest-asyncio = "^1.0.0"
python-frontmatter = "^1.0"
tiktoken = "^0.7.0"
questionary = "^2.0.1"
prompt-toolkit = "^3.0.43"
aiosqlite = "^0.20.0"
httpx = "^0.27.0"
pocketflow = {git = "https://github.com/The-Pocket/PocketFlow.git"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pre-commit = "^3.6.0"
ruff = "^0.1.7"

[tool.poetry.scripts]
daip-cli = "src.cli.main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py310"]
include = '\\.py$'
exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py310"
select = ["E", "F", "I", "B", "UP", "C90", "N", "D", "ANN", "TRY", "PT", "T20", "RET", "SIM"]
ignore = [
    "D203",
    "D213",
    "ANN101",
    "ANN102",
]
exclude = [".venv", "build", "dist", "migrations"]
fix = true

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["ANN", "T20", "D101", "D102"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true
show_error_codes = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[tool.pylint.master]
fail-under = 9.5

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "invalid-name",
    "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 120

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]