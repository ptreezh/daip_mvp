[tool.poetry]
name = "daip-mvp-project"
version = "0.3.11"
description = "DAIP-L.I.V.E. 智能协作平台，支持多AI角色协作与知识管理。"
authors = ["DAIP-LIVE Team"]
readme = "README.md"
package-mode = true

[[tool.poetry.packages]]
from = "."
include = "src"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
langchain = "^0.1.0"
llama-index = "^0.10.0"
ollama = "^0.5.1"
chromadb = "^1.0.13"
pydantic-settings = "^2.2.1"
pydantic = "^2.7.1"
streamlit = "^1.46.1"
psutil = "^7.0.0"
sqlmodel = "^0.0.24"
python-multipart = "^0.0.20"
scikit-learn = "^1.7.0"
matplotlib = "^3.10.3"
pytest-asyncio = "^1.0.0"
python-frontmatter = "^1.0"
tiktoken = "^0.7.0"
questionary = "^2.0.1"
prompt-toolkit = "^3.0.43"
aiosqlite = "^0.20.0"
httpx = "^0.27.0"
textstat = "^0.7.0"
pocketflow = {git = "https://github.com/The-Pocket/PocketFlow.git"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pre-commit = "^3.6.0"
ruff = "^0.1.7"

[tool.poetry.scripts]
daip-cli = "src.cli.main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py310"]
include = '\\.py$'
exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py310"
# 减少严格的规则，特别是那些可能与中文注释冲突的规则
# 移除了 "C90" (McCabe complexity), "N" (PEP 8 naming conventions), 
# "D" (Docstring rules, 除了已忽略的), "ANN" (Type annotation rules, 除了已忽略的),
# "TRY" (Exception handling rules), "T20" (Print statements), "SIM" (Code simplification)
# 保留 "E" (Pycodestyle errors), "F" (Pyflakes), "I" (Isort), "B" (Bugbear), "UP" (Pyupgrade)
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # 原有的忽略规则
    "D203",
    "D213",
    "ANN101",
    "ANN102",
    # 添加更多可能与项目实际情况冲突的规则
    "E501",  # Line too long (交给Black处理)
    "W191",  # Indentation contains tabs (交给Black处理)
    "E111",  # Indentation is not a multiple of four (交给Black处理)
    "E117",  # Over-indented (交给Black处理)
    "E701",  # Multiple statements on one line (交给Black处理)
    "E702",  # Multiple statements on one line (交给Black处理)
    "E703",  # Statement ends with a semicolon (交给Black处理)
    "E731",  # Do not assign a lambda expression, use a def (风格问题，可忽略)
    "B905",  # `zip()` without an explicit `strict=` parameter (严格模式, 可能过于严格)
]
exclude = [".venv", "build", "dist", "migrations"]
fix = true

[tool.ruff.pydocstyle]
convention = "google"

# 为测试文件进一步放宽规则
[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["ANN", "T20", "D101", "D102", "B011"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true
show_error_codes = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[tool.pylint.master]
fail-under = 9.5

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "invalid-name",
    "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 120

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]