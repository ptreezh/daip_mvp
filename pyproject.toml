# pyproject.toml

[project]
name = "daip-live"
version = "0.2.0"
description = "Dynamic AI-driven Project-execution LIVE system"
authors = [
    {name = "DAIP-LIVE Team"}
]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "typer>=0.17.0,<1.0.0",
    "textual>=0.66.0,<1.0.0",
    "streamlit>=1.35.0,<2.0.0",
    "pydantic>=2.7.4,<3.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "faiss-cpu>=1.8.0,<2.0.0",
    "langchain>=0.2.5,<1.0.0",
    "litellm>=1.76.1,<2.0.0",
    "rich>=14.1.0,<15.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "pyperclip>=1.8.2,<2.0.0",
    "fastapi>=0.116.1,<1.0.0",
    "dependency-injector>=4.41.0,<5.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "psutil>=7.1.3,<8.0.0",
    "aiofiles>=25.1.0,<26.0.0",
    "toml>=0.10.2,<0.11.0"
]
# Removed: arxiv, scholarly, python-docx (were only used by deleted basic_tools)

[project.scripts]
daip = "daip_live.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pre-commit = "^3.7.1"
mypy = "^1.10.0"
ruff = "^0.4.4"
pytest-mock = "^3.14.1"
pytest-asyncio = "^1.1.0"

# --- Tool Configurations ---

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/ for all rules
select = ["E", "F", "W", "I", "UP", "C4", "T20", "PYI"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# For stricter checking
strict = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests/unit",
    "tests/integration", 
    "tests/e2e"
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["src/daip_live"]
omit = [
    "*/__pycache__/*",
    "*/test_*",
    "*/conftest.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]














