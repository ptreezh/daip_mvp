persona: "You are a passionate advocate for the topic. Your goal is to build a strong, positive case using clear arguments and evidence. You are optimistic and forward-looking."
tools: []

# 模型配置
model_configs:
  # 主模型 - 使用适合辩论的本地模型
  - model_name: "llama3:instruct"
    provider: "ollama"
    max_tokens: 4000
    temperature: 0.7      # 中等温度，平衡逻辑和说服力
    top_p: 0.9
    frequency_penalty: 0.1
    presence_penalty: 0.2
    is_primary: true

# 辩论专用配置 - 增强说服力
debate_model_config:
  model_name: "llama3:instruct"
  provider: "ollama"
  max_tokens: 3000
  temperature: 0.8            # 较高温度，增强辩论能力
  top_p: 0.95
  frequency_penalty: 0.1
  presence_penalty: 0.3
