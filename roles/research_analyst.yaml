    temperature: 0.3
    top_p: 0.9
    frequency_penalty: 0.0
    presence_penalty: 0.0
    is_primary: true

  - model_name: "qwen3:8b"
    provider: "ollama"
    max_tokens: 4000
    temperature: 0.2
    top_p: 0.8
    frequency_penalty: 0.1
    presence_penalty: 0.1
    is_primary: false

