# ruff.toml

# Select a minimal set of rules focused on bugs and logic errors.
select = [
    "F",  # Pyflakes (undefined names, unused imports, etc.)
    "B",  # flake8-bugbear (potential bugs and design problems)
    "E7", # pycodestyle errors (e.g., E722 do not use bare 'except')
]

# Explicitly ignore stylistic rules.
ignore = [
    "E501", # Line too long
    "W291", # Trailing whitespace
    "W293", # Blank line contains whitespace
    "I001", # Unsorted imports
    "ANN",  # Disable all annotation checks for now
    "D",    # Disable all docstring checks
]

# Keep per-file ignores for specific cases where rules are too noisy.
[per-file-ignores]
"tests/**.py" = ["S101", "B006", "ARG001", "C901", "S603", "S607", "S605", "S602", "S604", "S601", "S606"]
"configs/**.py" = ["S102"]
"daip-cli.py" = ["T201"]
"web_demo_app.py" = ["T201"]
"demo*.py" = ["T201", "C901"]
"test_*.py" = ["T201", "C901", "PT009"]
"real_demo_system/**.py" = ["T201"]
"personal_intelligence_hub/**.py" = ["T201"]
"**/__init__.py" = ["D104"]
