<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1数据持久化 - 六向联动学习系统</title>
    <link rel="stylesheet" href="assets/css/unified-styles.css">
    <style>
        /* 六向联动系统样式 */
        .six-dimension-system {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        
        .system-header {
            background: white;
            padding: 2rem;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .system-header h1 {
            color: #1e293b;
            margin: 0 0 1rem 0;
            font-size: 2rem;
        }
        
        .system-header p {
            color: #64748b;
            margin: 0;
            font-size: 1.125rem;
        }
        
        /* 需求选择器 */
        .requirement-selector {
            background: white;
            padding: 2rem;
            margin: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .req-option {
            display: inline-block;
            margin: 0.5rem;
            padding: 1rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 150px;
        }
        
        .req-option:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        
        .req-option.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .req-option h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.125rem;
        }
        
        .req-option p {
            margin: 0 0 0.5rem 0;
            font-size: 0.875rem;
            opacity: 0.8;
        }
        
        .complexity-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #e2e8f0;
            color: #64748b;
        }
        
        .req-option.active .complexity-badge {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        /* 六向联动展示 */
        .six-dimension-view {
            padding: 2rem;
            display: none;
        }
        
        .six-dimension-view.active {
            display: block;
        }
        
        .dimension-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }
        
        .dimension-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
        }
        
        .dimension-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }
        
        .dimension-card.active {
            border-color: #667eea;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }
        
        .dimension-card::before {
            content: '👆 点击切换维度';
            position: absolute;
            top: -10px;
            right: 10px;
            background: #667eea;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.625rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .dimension-card:hover::before {
            opacity: 1;
        }
        
        .dimension-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .dimension-header h3 {
            margin: 0;
            color: #1e293b;
            font-size: 1.25rem;
        }
        
        .complexity-indicator {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .complexity-indicator.simple {
            background: #dcfce7;
            color: #16a34a;
        }
        
        .complexity-indicator.medium {
            background: #fef3c7;
            color: #d97706;
        }
        
        .complexity-indicator.complex {
            background: #ddd6fe;
            color: #7c3aed;
        }
        
        .complexity-indicator.very-complex {
            background: #fecaca;
            color: #dc2626;
        }
        
        .dimension-content {
            line-height: 1.6;
        }
        
        .content-section {
            margin-bottom: 1rem;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid;
        }
        
        .section-prompt { border-left-color: #3b82f6; background: #eff6ff; }
        .section-spec { border-left-color: #10b981; background: #f0fdf4; }
        .section-design { border-left-color: #8b5cf6; background: #f3e8ff; }
        .section-plan { border-left-color: #f59e0b; background: #fffbeb; }
        .section-code { border-left-color: #ef4444; background: #fef2f2; }
        
        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            color: #1e293b;
        }
        
        .section-content {
            font-size: 0.875rem;
            line-height: 1.5;
            margin: 0;
            color: #475569;
        }
        
        .cross-reference {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 0.75rem;
            margin-top: 1rem;
        }
        
        .cross-reference-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            margin: 0 0 0.5rem 0;
        }
        
        .cross-reference-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .ref-link {
            padding: 0.25rem 0.5rem;
            background: #e2e8f0;
            color: #475569;
            border-radius: 4px;
            font-size: 0.75rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .ref-link:hover {
            background: #667eea;
            color: white;
        }
        
        .ref-link.active {
            background: #667eea;
            color: white;
        }
        
        /* 导航栏 */
        .cross-navigation {
            background: white;
            padding: 1rem 2rem;
            border-top: 1px solid #e2e8f0;
            position: sticky;
            bottom: 0;
            z-index: 20;
        }
        
        .nav-flow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .nav-section {
            padding: 0.5rem 1rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 120px;
        }
        
        .nav-section:hover {
            background: #e2e8f0;
        }
        
        .nav-section.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .nav-arrow {
            color: #667eea;
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        /* 实施计划步骤对应代码 */
        .step-code-mapping {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .implementation-step {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            padding: 1rem;
        }
        
        .code-correspondence {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 1rem;
        }
        
        .step-title {
            font-weight: 600;
            color: #15803d;
            margin: 0 0 0.5rem 0;
            font-size: 0.875rem;
        }
        
        .code-title {
            font-weight: 600;
            color: #dc2626;
            margin: 0 0 0.5rem 0;
            font-size: 0.875rem;
        }
        
        .code-snippet {
            background: #1e293b;
            color: #f8fafc;
            border-radius: 4px;
            padding: 0.75rem;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            overflow-x: auto;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .dimension-grid {
                grid-template-columns: 1fr;
            }
            
            .step-code-mapping {
                grid-template-columns: 1fr;
            }
            
            .nav-flow {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .nav-arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>

from abc import ABC, abstractmethod
from typing import Dict, List, Any, Optional

class DataStoreInterface(ABC):
    @abstractmethod
    def save(self, key: str, data: Any) -> bool:
        pass
    
    @abstractmethod
    def load(self, key: str) -> Optional[Any]:
        pass

from collections import OrderedDict
from functools import wraps
import threading
import time

class LRUCache:
    def __init__(self, capacity: int = 100):
        self.cache = OrderedDict()
        self.capacity = capacity
        self.lock = threading.RLock()
    
    def get(self, key):
        with self.lock:
            if key in self.cache:
                value = self.cache.pop(key)
                self.cache[key] = value
                return value
            return None
    
    def put(self, key, value):
        with self.lock:
            if key in self.cache:
                self.cache.pop(key)
            elif len(self.cache) >= self.capacity:
                self.cache.popitem(last=False)
            self.cache[key] = value

from abc import ABC, abstractmethod
from typing import Type
import importlib

class DataStoreInterface(ABC):
    @abstractmethod
    def save(self, key: str, data) -> bool:
        pass

class StorageFactory:
    def __init__(self):
        self._registry = {
            'json': 'storage.json_storage.JSONStorage',
            'sqlite': 'storage.sqlite_storage.SQLiteStorage',
            'file': 'storage.file_storage.FileStorage'
        }
    
    def create_storage(self, storage_type: str, **kwargs):
        if storage_type not in self._registry:
            raise ValueError(f"不支持的存储类型: {storage_type}")
        
        module_path, class_name = self._registry[storage_type].rsplit('.', 1)
        module = importlib.import_module(module_path)
        storage_class = getattr(module, class_name)

            const requirement = requirementData[currentRequirement];
            const data = requirement.data;
            
            // 重新加载所有维度的内容
            Object.keys(data).forEach(dim => {
                const contentElement = document.getElementById(`${dim}-content`);
                if (contentElement) {
                    // 清除现有内容
                    contentElement.innerHTML = '';
                    
                    // 重新加载对应内容
                    contentElement.innerHTML = data[dim].content;
                    
                    // 重新添加交叉引用
                    addCrossReferences(contentElement, data[dim].crossRefs);
                    
                    // 添加维度切换按钮
                    addDimensionSwitcher(contentElement, dim);
                }
            });
            
            // 为每个维度卡片添加点击事件，实现真正的联动
            document.querySelectorAll('.dimension-card').forEach(card => {
                card.onclick = function() {
                    const dim = this.getAttribute('data-dimension');
                    navigateDimension(dim);
                };
            });
        }
        
        // 添加维度切换器
        function addDimensionSwitcher(container, currentDim) {
            const switcherDiv = document.createElement('div');
            switcherDiv.style.cssText = 'margin-top: 1rem; padding: 0.75rem; background: #f1f5f9; border-radius: 6px; border: 1px solid #cbd5e1;';
            switcherDiv.innerHTML = `
                <div style="font-size: 0.75rem; font-weight: 600; color: #475569; margin-bottom: 0.5rem;">🔄 切换到其他维度</div>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    ${Object.keys(requirementData[currentRequirement].data).map(dim => `
                        <button onclick="navigateDimension('${dim}')" 
                                style="padding: 0.25rem 0.5rem; border: 1px solid ${dim === currentDim ? '#667eea' : '#cbd5e1'}; 
                                       background: ${dim === currentDim ? '#667eea' : 'white'}; 
                                       color: ${dim === currentDim ? 'white' : '#475569'}; 
                                       border-radius: 4px; font-size: 0.75rem; cursor: pointer;">
                            ${getDimensionName(dim)}
                        </button>
                    `).join('')}
                </div>
            `;
            container.appendChild(switcherDiv);
        }

        // 高亮当前维度
        function highlightCurrentDimension(dimension) {
            document.querySelectorAll('.dimension-card').forEach(el => {
                el.classList.remove('active');
            });
            
            const targetCard = document.querySelector(`[data-dimension="${dimension}"]`);
            if (targetCard) {
                targetCard.classList.add('active');
            }
        }

        // 导航到维度（从交叉引用）
        function navigateToDimension(dimension) {
            navigateDimension(dimension);
            
            // 添加高亮动画
            activeRefs.add(dimension);
            setTimeout(() => {
                activeRefs.delete(dimension);
            }, 2000);
        }

        // 重置视图
        function resetAllView() {
            document.getElementById('requirement-selector').style.display = 'block';
            document.getElementById('dimension-content').classList.remove('active');
            
            // 重置状态
            currentRequirement = 'FR-001';
            currentDimension = 'prompt';
            
            // 重置UI
            document.querySelectorAll('.req-option').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelector('[data-requirement="FR-001"]').classList.add('active');
            
            document.querySelectorAll('.nav-section').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelector('[onclick="navigateDimension(\'prompt\')"]').classList.add('active');
            
            console.log('视图已重置');
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎯 P1数据持久化 - 六向联动学习系统已加载');
            console.log('💡 点击任意需求开始学习');
            console.log('🔗 点击任意维度，其他五个自动对齐');
            console.log('📊 当前系统状态: ', { currentRequirement, currentDimension });
            
            // 预加载数据以提高响应速度
            console.log('📦 预加载需求数据: ', Object.keys(requirementData));
        });
    </script>
</body>
</html>
