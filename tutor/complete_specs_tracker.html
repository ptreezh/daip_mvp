        * {

            padding: 0;

        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            min-width: 300px;
        }

        .controls input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover {
            border-color: #667eea;
            transform: translateY(-1px);
        }

        .stats {
            padding: 15px 20px;
            background: #e7f3ff;
            border-radius: 8px;
            margin: 0 20px 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #004085;
        }

        .stat-label {
            font-size: 0.9em;
            color: #6c757d;
        }

        .content {
            padding: 20px;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .spec-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .spec-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .spec-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .spec-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #2c3e50;
            flex: 1;
            margin-right: 15px;
        }

        .spec-status {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
            white-space: nowrap;
        }

        .status-implemented {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-partial {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status-planned {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status-archived {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .spec-category {
            display: inline-block;
            padding: 2px 8px;
            background: #e7f3ff;
            color: #004085;
            border-radius: 12px;
            font-size: 0.75em;
            margin-bottom: 10px;
        }

        .spec-description {
            color: #555;
            margin-bottom: 15px;
            line-height: 1.5;
            font-size: 0.9em;
        }

        .implementation-section {
            margin-bottom: 15px;
        }

        .section-title {
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .file-list {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 0.85em;
        }

        .file-path {
            font-family: 'Courier New', monospace;
            color: #0066cc;
            text-decoration: none;
            flex: 1;
        }

        .file-path:hover {
            text-decoration: underline;
        }

        .file-status {
            font-size: 0.8em;
            color: #6c757d;
        }

        .changelog-section {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }

        .changelog-title {
            font-weight: bold;
            color: #495057;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 0.8em;
            padding: 4px 8px;
            background: #dee2e6;
            border: none;
            border-radius: 4px;
            cursor: pointer;

        .changelog-list {
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .changelog-list.expanded {
            display: block;
        }

        .changelog-item {

            justify-content: space-between;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
            font-size: 0.85em;
        }

        .changelog-item:last-child {
            border-bottom: none;
        }

        .changelog-content {
            flex: 1;
            margin-right: 15px;
        }

        .changelog-date {
            color: #6c757d;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: nowrap;
        }

            color: #6c757d;

        // 分类映射
        const categoryMap = {
            "Agent Engine": "代理引擎",
            "Persistence": "数据持久化",
            "Knowledge": "知识管理",
            "Model Provider": "模型提供者",
            "TUI": "用户界面",
            "CLI": "命令行界面",
            "Debate System": "辩论系统",
            "Scaffolding": "项目脚手架",
            "Intent Recognition": "意图识别",
            "Architecture": "系统架构",
            "Testing": "测试验证",
            "Performance": "性能优化",
            "Security": "安全控制",
            "Documentation": "文档管理",
            "Deployment": "部署运维"
        };

        // 初始化页面
        function initializePage() {
            renderSpecs(specsData);
            updateStats();
            setupEventListeners();
            updateLastUpdateTime();
        }

        // 渲染规格文档
        function renderSpecs(specs) {
            const grid = document.getElementById('specsGrid');
            const loading = document.querySelector('.loading');

            if (loading) {
                loading.style.display = 'none';
            }
            grid.style.display = 'grid';

            specs.forEach(spec => {
                const card = createSpecCard(spec);
                grid.appendChild(card);
            });
        }

        // 创建规格卡片
        function createSpecCard(spec) {
            const card = document.createElement('div');
            card.className = 'spec-card';
            card.dataset.status = spec.status;

            const category = categoryMap[spec.category] || spec.category;

            card.innerHTML = `
                <div class="spec-header">
                    <div class="spec-title">${spec.title}</div>
                    <div class="spec-status">
                        ${getStatusBadge(spec.status)}
                        <span class="status-badge status-archived">${category}</span>
                    </div>
                </div>
                <div class="spec-category">📁 ${category}</div>
                <div class="spec-description">${spec.description}</div>

                <div class="implementation-section">
                    <div class="section-title">🗄️ 实现文件</div>
                    <div class="file-list">
                        ${spec.implementation.files.map(file => `
                            <div class="file-item">
                                <a href="#${file.path}" class="file-path">${file.path}</a>
                                <span class="file-status">${file.status}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${spec.notes ? `
                    <div class="notes-section">
                        <h6>⚠️ 注意事项</h6>
                        <ul class="notes-list">
                            ${spec.notes.map(note => `<li>${note}</li>`).join('')}
                        </ul>
                    </div>
                ` : ''}

                ${spec.changelog && spec.changelog.length > 0 ? `
                    <div class="changelog-section">
                        <div class="changelog-title">
                            📅 变更记录
                            <button class="changelog-toggle" onclick="toggleChangelog(this)">展开</button>
                        </div>
                        <div class="changelog-list">
                            ${spec.changelog.map(item => `
                                <div class="changelog-item">
                                    <div class="changelog-content">${item.content}</div>
                                    <div class="changelog-date">${item.version} | ${item.date}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
            `;

            return card;
        }

        // 获取状态徽章
        function getStatusBadge(status) {
            const badges = {
                implemented: '<span class="status-badge status-implemented">✅ 已实现</span>',
                partial: '<span class="status-badge status-partial">🔄 部分实现</span>',
                planned: '<span class="status-badge status-planned">📋 计划中</span>',
                archived: '<span class="status-badge status-archived">📦 已归档</span>'
            };
            return badges[status] || badges.planned;
        }

        // 切换变更记录显示
        function toggleChangelog(button) {
            const changelogList = button.parentElement.nextElementSibling;
            changelogList.classList.toggle('expanded');
            button.textContent = changelogList.classList.contains('expanded') ? '收起' : '展开';
        }

        // 更新统计信息
        function updateStats() {
            const stats = {
                total: specsData.length,
                implemented: specsData.filter(s => s.status === 'implemented').length,
                partial: specsData.filter(s => s.status === 'partial').length,
                planned: specsData.filter(s => s.status === 'planned').length
            };

            document.getElementById('totalSpecs').textContent = stats.total;
            document.getElementById('implementedCount').textContent = stats.implemented;
            document.getElementById('partialCount').textContent = stats.partial;
            document.getElementById('plannedCount').textContent = stats.planned;
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 搜索功能
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', filterSpecs);

            // 过滤按钮
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // 更新活动状态
                    filterButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    // 执行过滤
                    const filter = this.dataset.filter;
                    filterSpecs(filter);
                });
            });
        }

        // 过滤规格
        function filterSpecs(filter) {
            const cards = document.querySelectorAll('.spec-card');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            cards.forEach(card => {
                const matchesFilter = filter === 'all' || card.dataset.status === filter;
                const matchesSearch = searchTerm === '' ||
                    card.textContent.toLowerCase().includes(searchTerm);

                card.style.display = (matchesFilter && matchesSearch) ? 'block' : 'none';
            });
        }

        // 更新最后更新时间
        function updateLastUpdateTime() {
            const now = new Date();
            const formattedDate = now.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            document.getElementById('lastUpdate').textContent = formattedDate;
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
