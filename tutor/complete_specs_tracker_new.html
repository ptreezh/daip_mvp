                    {version: "v1.8.0", date: "2024-10-20", content: "改进会话状态持久化"},
                    {version: "v1.5.0", date: "2024-10-10", content: "初步内存服务实现"}
                ]
            }
            // ... 其他规格文档可以继续添加
        ];

        // 分类映射
        const categoryMap = {
            "Agent Engine": "代理引擎",
            "Persistence": "数据持久化",
            "Knowledge": "知识管理",
            "Model Provider": "模型提供者",
            "TUI": "用户界面",
            "CLI": "命令行界面",
            "Debate System": "辩论系统",
            "Scaffolding": "项目脚手架",
            "Intent Recognition": "意图识别",
            "Architecture": "系统架构",
            "Testing": "测试验证",
            "Performance": "性能优化",
            "Security": "安全控制",
            "Documentation": "文档管理",
            "Deployment": "部署运维"
        };

        // 获取状态徽章
        function getStatusBadge(status) {
            const badges = {
                implemented: '<span class="status-badge status-implemented"><i class="fas fa-check-circle"></i> 已实现</span>',
                partial: '<span class="status-badge status-partial"><i class="fas fa-clock"></i> 部分实现</span>',
                planned: '<span class="status-badge status-planned"><i class="fas fa-calendar"></i> 计划中</span>',
                archived: '<span class="status-badge status-archived"><i class="fas fa-archive"></i> 已归档</span>'
            };
            return badges[status] || badges.planned;
        }

        // 获取状态样式类
        function getStatusClass(status) {
            const classes = {
                implemented: 'status-implemented',
                partial: 'status-partial',
                planned: 'status-planned',
                archived: 'status-archived'
            };
            return classes[status] || 'status-planned';
        }

        // 获取状态图标
        function getStatusIcon(status) {
            const icons = {
                implemented: 'fa-check-circle',
                partial: 'fa-clock',
                planned: 'fa-calendar',
                archived: 'fa-archive'
            };
            return icons[status] || 'fa-calendar';
        }

        // 创建规格卡片
        function createSpecCard(spec) {
            const card = document.createElement('div');
            card.className = 'spec-card animate-on-scroll';
            card.dataset.status = spec.status;

            const category = categoryMap[spec.category] || spec.category;
            const statusIcon = getStatusIcon(spec.status);
            const statusClass = getStatusClass(spec.status);

            card.innerHTML = `
                <div class="spec-card-header">
                    <div class="spec-card-title">
                        <h3 class="spec-title">${spec.title}</h3>
                        <div class="spec-badges">
                            ${getStatusBadge(spec.status)}
                            <span class="category-badge">
                                <i class="fas fa-folder"></i>
                                ${category}
                            </span>
                        </div>
                    </div>
                    <div class="spec-status-indicator">
                        <i class="fas ${statusIcon} ${statusClass}"></i>
                    </div>
                </div>

                <div class="spec-card-content">
                    <div class="spec-description">
                        <i class="fas fa-info-circle"></i>
                        <p>${spec.description}</p>
                    </div>

                    <div class="implementation-section">
                        <h4 class="section-title">
                            <i class="fas fa-code"></i>
                            实现文件
                        </h4>
                        <div class="file-list">
                            ${spec.implementation.files.map(file => `
                                <div class="file-item">
                                    <div class="file-path">
                                        <i class="fas fa-file-code"></i>
                                        ${file.path}
                                    </div>
                                    <div class="file-status">
                                        <i class="fas ${getStatusIcon(spec.status)}"></i>
                                        ${file.status}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${spec.notes ? `
                        <div class="notes-section">
                            <h4 class="section-title">
                                <i class="fas fa-exclamation-triangle"></i>
                                注意事项
                            </h4>
                            <ul class="notes-list">
                                ${spec.notes.map(note => `<li>${note}</li>`).join('')}
                            </ul>
                        </div>
                    ` : ''}

                    ${spec.changelog && spec.changelog.length > 0 ? `
                        <div class="changelog-section">
                            <div class="changelog-header">
                                <h4 class="section-title">
                                    <i class="fas fa-history"></i>
                                    变更记录
                                </h4>
                                <button class="changelog-toggle" onclick="toggleChangelog(this)">
                                    <i class="fas fa-chevron-down"></i>
                                    展开
                                </button>
                            </div>
                            <div class="changelog-list">
                                ${spec.changelog.map(item => `
                                    <div class="changelog-item">
                                        <div class="changelog-content">
                                            <div class="changelog-text">${item.content}</div>
                                        </div>
                                        <div class="changelog-meta">
                                            <span class="changelog-version">${item.version}</span>
                                            <span class="changelog-date">${item.date}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            return card;
        }

        // 切换变更记录显示
        function toggleChangelog(button) {
            const changelogList = button.parentElement.nextElementSibling;
            const icon = button.querySelector('i');
            
            changelogList.classList.toggle('expanded');
            
            if (changelogList.classList.contains('expanded')) {
                button.innerHTML = '<i class="fas fa-chevron-up"></i> 收起';
                changelogList.style.display = 'block';
            } else {
                button.innerHTML = '<i class="fas fa-chevron-down"></i> 展开';
                changelogList.style.display = 'none';
            }
        }

        // 更新统计信息
        function updateStats() {
            const stats = {
                total: specsData.length,
                implemented: specsData.filter(s => s.status === 'implemented').length,
                partial: specsData.filter(s => s.status === 'partial').length,
                planned: specsData.filter(s => s.status === 'planned').length
            };

            // 动画计数效果
            animateNumber('totalSpecs', stats.total);
            animateNumber('implementedCount', stats.implemented);
            animateNumber('partialCount', stats.partial);
            animateNumber('plannedCount', stats.planned);
        }

        // 数字动画效果
        function animateNumber(elementId, targetNumber) {
            const element = document.getElementById(elementId);
            if (!element) return;
            
            const startNumber = 0;
            const duration = 1000;
            const startTime = performance.now();
            
            function updateNumber(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const currentNumber = Math.floor(startNumber + (targetNumber - startNumber) * easeOutQuart(progress));
                element.textContent = currentNumber;
                
                if (progress < 1) {
                    requestAnimationFrame(updateNumber);
                }
            }
            
            requestAnimationFrame(updateNumber);
        }

        // 缓动函数
        function easeOutQuart(t) {
            return 1 - Math.pow(1 - t, 4);
        }

        // 渲染规格文档
        function renderSpecs(specs) {
            const grid = document.getElementById('specsGrid');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');

            // 隐藏加载状态
            if (loadingState) {
                loadingState.style.display = 'none';
            }

            // 清空网格
            grid.innerHTML = '';

            if (specs.length === 0) {
                // 显示空状态
                grid.style.display = 'none';
                if (emptyState) {
                    emptyState.style.display = 'block';
                }
                return;
            }

            // 隐藏空状态
            if (emptyState) {
                emptyState.style.display = 'none';
            }

            // 显示网格
            grid.style.display = 'grid';

            // 逐个添加卡片以支持动画
            specs.forEach((spec, index) => {
                setTimeout(() => {
                    const card = createSpecCard(spec);
                    grid.appendChild(card);
                    
                    // 触发滚动动画
                    if (window.animateOnScroll) {
                        window.animateOnScroll();
                    }
                }, index * 100);
            });
        }

        // 过滤规格
        function filterSpecs(filter) {
            const cards = document.querySelectorAll('.spec-card');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let visibleCount = 0;

            cards.forEach(card => {
                const matchesFilter = filter === 'all' || card.dataset.status === filter;
                const matchesSearch = searchTerm === '' ||
                    card.textContent.toLowerCase().includes(searchTerm);

                const shouldShow = matchesFilter && matchesSearch;
                card.style.display = shouldShow ? 'block' : 'none';
                
                if (shouldShow) {
                    visibleCount++;
                }
            });

            // 更新空状态显示
            const emptyState = document.getElementById('emptyState');
            if (emptyState) {
                emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
            }
        }

        // 更新最后更新时间
        function updateLastUpdateTime() {
            const now = new Date();
            const formattedDate = now.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            const lastUpdateElement = document.getElementById('lastUpdate');
            if (lastUpdateElement) {
                lastUpdateElement.textContent = formattedDate;
            }
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 搜索功能
            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');
            
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    filterSpecs(getCurrentFilter());
                    
                    // 显示/隐藏清除按钮
                    if (searchClear) {
                        searchClear.style.display = searchInput.value ? 'block' : 'none';
                    }
                });
            }

            // 清除搜索
            if (searchClear) {
                searchClear.addEventListener('click', () => {
                    if (searchInput) {
                        searchInput.value = '';
                        filterSpecs(getCurrentFilter());
                    }
                    searchClear.style.display = 'none';
                });
            }

            // 过滤按钮
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // 更新活动状态
                    filterButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    // 执行过滤
                    const filter = this.dataset.filter;
                    filterSpecs(filter);
                });
            });
        }

        // 获取当前过滤器
        function getCurrentFilter() {
            const activeFilter = document.querySelector('.filter-btn.active');
            return activeFilter ? activeFilter.dataset.filter : 'all';
        }

        // 初始化页面
        function initializePage() {
            renderSpecs(specsData);
            updateStats();
            setupEventListeners();
            updateLastUpdateTime();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 等待页面完全加载
            setTimeout(initializePage, 500);
        });

        // 处理页面可见性变化
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                // 页面变为可见时重新计算动画
                if (window.animateOnScroll) {
                    setTimeout(window.animateOnScroll, 100);
                }
            }
        });
    </script>
</body>
</html>
