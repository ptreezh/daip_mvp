<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript交互验证</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background: #f8fafc;
        }
        .test-section {
            background: white;
            padding: 1.5rem;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-button {
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 0.5rem;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            background: #5a67d8;
            transform: translateY(-1px);
        }
        .result {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            font-weight: 600;
        }
        .success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #16a34a;
        }
        .error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #dc2626;
        }
        .info {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #2563eb;
        }
        .test-item {
            background: #f8fafc;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }
        .status-pass { background: #10b981; }
        .status-fail { background: #ef4444; }
        .status-pending { background: #f59e0b; }
    </style>
</head>
<body>
    <h1>🔧 JavaScript交互功能验证</h1>
    <p>这个页面用于验证基础JavaScript交互功能是否正常工作</p>

    <div class="test-section">
        <h2>基础点击测试</h2>
        <button class="test-button" onclick="testBasicClick()">测试基础点击</button>
        <button class="test-button" onclick="testEventBinding()">测试事件绑定</button>
        <button class="test-button" onclick="testDynamicContent()">测试动态内容</button>
        <button class="test-button" onclick="runAllTests()">运行所有测试</button>
        <div id="basic-result"></div>
    </div>

    <div class="test-section">
        <h2>六向联动系统测试</h2>
        <button class="test-button" onclick="testSixDimensionSystem()">测试六向联动系统</button>
        <button class="test-button" onclick="testRequirementSelection()">测试需求选择</button>
        <button class="test-button" onclick="testDimensionNavigation()">测试维度导航</button>
        <div id="six-dimension-result"></div>
    </div>

    <div class="test-section">
        <h2>详细测试结果</h2>
        <div id="detailed-results"></div>
    </div>

    <script>
        let testResults = [];

        function logTestResult(testName, status, message) {
            testResults.push({ testName, status, message, timestamp: new Date() });
            console.log(`[${status.toUpperCase()}] ${testName}: ${message}`);
            
            updateDetailedResults();
        }

        function updateDetailedResults() {
            const container = document.getElementById('detailed-results');
            container.innerHTML = testResults.map(result => 
                `<div class="test-item">
                    <span class="status-indicator status-${result.status}"></span>
                    <strong>${result.testName}</strong> - ${result.message}
                    <br><small>${result.timestamp.toLocaleTimeString()}</small>
                </div>`
            ).join('');
        }

        function testBasicClick() {
            try {
                logTestResult('基础点击测试', 'pending', '开始测试...');
                
                // 创建测试元素
                const testElement = document.createElement('div');
                testElement.id = 'test-click-element';
                testElement.innerHTML = '点击我';
                testElement.style.cssText = `
                    padding: 1rem;
                    background: #667eea;
                    color: white;
                    cursor: pointer;
                    border-radius: 6px;
                    display: inline-block;
                    margin: 0.5rem 0;
                `;
                
                // 绑定点击事件
                testElement.addEventListener('click', function() {
                    logTestResult('基础点击测试', 'pass', '点击事件成功触发！');
                    this.style.background = '#10b981';
                    this.innerHTML = '点击成功！';
                });
                
                document.body.appendChild(testElement);
                
                // 模拟点击
                setTimeout(() => {
                    testElement.click();
                }, 100);
                
                logTestResult('基础点击测试', 'info', '测试元素已创建，等待点击...');
                
            } catch (error) {
                logTestResult('基础点击测试', 'fail', `错误: ${error.message}`);
            }
        }

        function testEventBinding() {
            try {
                logTestResult('事件绑定测试', 'pending', '开始测试事件绑定...');
                
                // 测试多种事件绑定方式
                const testElement1 = document.createElement('button');
                testElement1.innerHTML = '内联onclick测试';
                testElement1.onclick = function() {
                    logTestResult('事件绑定测试', 'pass', '内联onclick绑定成功！');
                };
                
                const testElement2 = document.createElement('button');
                testElement2.innerHTML = 'addEventListener测试';
                testElement2.addEventListener('click', function() {
                    logTestResult('事件绑定测试', 'pass', 'addEventListener绑定成功！');
                });
                
                document.body.appendChild(testElement1);
                document.body.appendChild(testElement2);
                
                // 测试绑定
                setTimeout(() => {
                    testElement1.click();
                    testElement2.click();
                }, 200);
                
            } catch (error) {
                logTestResult('事件绑定测试', 'fail', `错误: ${error.message}`);
            }
        }

        function testDynamicContent() {
            try {
                logTestResult('动态内容测试', 'pending', '开始测试动态内容...');
                
                const contentArea = document.getElementById('basic-result');
                
                // 模拟动态内容加载
                contentArea.innerHTML = `
                    <div class="result success">
                        <strong>✅ 动态内容加载成功！</strong><br>
                        JavaScript可以正常操作DOM元素并更新内容。
                        <br><small>测试时间: ${new Date().toLocaleTimeString()}</small>
                    </div>
                `;
                
                logTestResult('动态内容测试', 'pass', 'DOM操作和内容更新正常！');
                
            } catch (error) {
                logTestResult('动态内容测试', 'fail', `错误: ${error.message}`);
            }
        }

        function testSixDimensionSystem() {
            try {
                logTestResult('六向联动系统测试', 'pending', '开始测试六向联动系统...');
                
                // 检查六向联动系统是否存在
                const systemExists = typeof window.selectRequirement !== 'undefined' ||
                                   typeof window.navigateDimension !== 'undefined';
                
                if (systemExists) {
                    logTestResult('六向联动系统测试', 'pass', '六向联动函数已定义！');
                } else {
                    logTestResult('六向联动系统测试', 'fail', '六向联动函数未定义！');
                    
                    // 尝试加载六向联动系统
                    loadSixDimensionSystem();
                }
                
            } catch (error) {
                logTestResult('六向联动系统测试', 'fail', `错误: ${error.message}`);
            }
        }

        function loadSixDimensionSystem() {
            try {
                logTestResult('加载六向联动系统', 'info', '正在加载六向联动系统...');
                
                // 模拟六向联动系统的核心函数
                window.selectRequirement = function(requirement) {
                    console.log(`选择需求: ${requirement}`);
                    logTestResult('需求选择函数', 'pass', `成功调用selectRequirement('${requirement}')`);
                    return true;
                };
                
                window.navigateDimension = function(dimension) {
                    console.log(`导航到维度: ${dimension}`);
                    logTestResult('维度导航函数', 'pass', `成功调用navigateDimension('${dimension}')`);
                    return true;
                };
                
                window.currentRequirement = 'FR-001';
                window.currentDimension = 'prompt';
                
                logTestResult('加载六向联动系统', 'pass', '六向联动系统函数已成功加载！');
                
            } catch (error) {
                logTestResult('加载六向联动系统', 'fail', `加载失败: ${error.message}`);
            }
        }

        function testRequirementSelection() {
            try {
                if (typeof window.selectRequirement === 'function') {
                    window.selectRequirement('FR-001');
                    logTestResult('需求选择测试', 'pass', '需求选择功能正常！');
                } else {
                    logTestResult('需求选择测试', 'fail', 'selectRequirement函数未定义');
                }
            } catch (error) {
                logTestResult('需求选择测试', 'fail', `错误: ${error.message}`);
            }
        }

        function testDimensionNavigation() {
            try {
                if (typeof window.navigateDimension === 'function') {
                    const dimensions = ['prompt', 'spec', 'design', 'plan', 'code', 'correlation'];
                    
                    dimensions.forEach((dim, index) => {
                        setTimeout(() => {
                            window.navigateDimension(dim);
                        }, index * 100);
                    });
                    
                    logTestResult('维度导航测试', 'info', `正在测试 ${dimensions.length} 个维度的导航...`);
                } else {
                    logTestResult('维度导航测试', 'fail', 'navigateDimension函数未定义');
                }
            } catch (error) {
                logTestResult('维度导航测试', 'fail', `错误: ${error.message}`);
            }
        }

        function runAllTests() {
            logTestResult('完整测试套件', 'info', '开始运行所有测试...');
            
            // 依次运行所有测试
            setTimeout(testBasicClick, 100);
            setTimeout(testEventBinding, 500);
            setTimeout(testDynamicContent, 900);
            setTimeout(testSixDimensionSystem, 1300);
            setTimeout(testRequirementSelection, 1700);
            setTimeout(testDimensionNavigation, 2100);
            
            setTimeout(() => {
                const passCount = testResults.filter(r => r.status === 'pass').length;
                const failCount = testResults.filter(r => r.status === 'fail').length;
                const totalCount = testResults.length;
                
                logTestResult('测试总结', 'info', 
                    `总计: ${totalCount} 个测试, 成功: ${passCount}, 失败: ${failCount}`);
                
                if (failCount === 0) {
                    logTestResult('最终结果', 'pass', '🎉 所有测试通过！JavaScript交互功能正常！');
                } else {
                    logTestResult('最终结果', 'fail', `❌ ${failCount} 个测试失败，需要修复！`);
                }
            }, 3500);
        }

        // 页面加载时自动运行基础测试
        window.addEventListener('load', function() {
            console.log('页面加载完成，开始JavaScript验证...');
            logTestResult('页面加载', 'info', '页面加载完成，JavaScript环境正常');
            
            // 延迟运行基础测试
            setTimeout(() => {
                testBasicClick();
                testDynamicContent();
            }, 500);
        });

        // 全局错误处理
        window.addEventListener('error', function(event) {
            logTestResult('全局错误', 'fail', `JavaScript错误: ${event.message}`);
        });
    </script>
</body>
</html>
