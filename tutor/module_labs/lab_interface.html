<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAIP-LIVE 交互式模块实验室</title>
    <link rel="stylesheet" href="../assets/css/unified-styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 使用统一设计系统的变量 */
            --primary-color: var(--primary);
            --secondary-color: var(--secondary);
            --success-color: var(--success);
            --warning-color: var(--warning);
            --danger-color: var(--error);
            --dark-color: var(--gray-800);
            --light-color: var(--gray-50);
            --border-color: var(--border);
            --shadow: var(--shadow);
            --shadow-lg: var(--shadow-lg);
            --bg-gradient: var(--bg-gradient);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle {
            color: var(--secondary-color);
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: var(--light-color);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--border-color);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            color: var(--dark-color);
            margin-top: 5px;
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .filter-select {
            padding: 12px 20px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .module-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--shadow);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .module-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 5px;
        }

        .module-id {
            background: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .module-type {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .type-original {
            background: var(--success-color);
            color: white;
        }

        .type-new {
            background: var(--warning-color);
            color: white;
        }

        .type-support {
            background: var(--secondary-color);
            color: white;
        }

        .type-project {
            background: var(--danger-color);
            color: white;
        }

        .module-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .module-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--dark-color);
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .module-content {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .content-section {
            margin-bottom: 15px;
        }

        .content-title {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .content-list {
            list-style: none;
            font-size: 0.9rem;
            color: #4b5563;
        }

        .content-list li {
            padding: 3px 0;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .content-list li::before {
            content: '→';
            color: var(--primary-color);
            font-weight: bold;
            flex-shrink: 0;
        }

        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 60px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 1.5rem;
            color: var(--dark-color);
            margin-bottom: 10px;
        }

        .empty-description {
            color: #6b7280;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 800px;
            max-height: 90vh;
            margin: 40px auto;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 30px;
            border-radius: 16px 16px 0 0;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .modal-body {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .objective-card, .exercise-card {
            background: var(--light-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-color);
        }

        .objective-title, .exercise-title {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 10px;
        }

        .exercise-difficulty {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .difficulty-beginner {
            background: var(--success-color);
            color: white;
        }

        .difficulty-intermediate {
            background: var(--warning-color);
            color: white;
        }

        .difficulty-advanced {
            background: var(--danger-color);
            color: white;
        }

        @media (max-width: 768px) {
            .modules-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: auto;
            }
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            font-size: 1.2rem;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                🎓 DAIP-LIVE 交互式模块实验室
            </h1>
            <p class="subtitle">基于真实项目结构的SPEC驱动开发学习平台</p>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalModules">-</div>
                    <div class="stat-label">总模块数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="originalModules">-</div>
                    <div class="stat-label">核心P模块</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="supportModules">-</div>
                    <div class="stat-label">支撑模块</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalDocs">-</div>
                    <div class="stat-label">相关文档</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索模块名称或ID...">
            </div>
            <select class="filter-select" id="typeFilter">
                <option value="">所有类型</option>
                <option value="original">原始P模块</option>
                <option value="new">重构模块</option>
                <option value="support">支撑模块</option>
                <option value="project">项目模块</option>
            </select>
            <select class="filter-select" id="sortBy">
                <option value="name">按名称排序</option>
                <option value="id">按ID排序</option>
                <option value="docs">按文档数量排序</option>
            </select>
        </div>

        <div class="loading" id="loading">
            正在加载模块数据...
        </div>

        <div class="modules-grid" id="modulesGrid">
            <!-- 模块卡片将在这里动态生成 -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">未找到匹配的模块</div>
            <div class="empty-description">尝试调整搜索条件或筛选器</div>
        </div>
    </div>

    <!-- 模块详情模态框 -->
    <div class="modal" id="moduleModal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <h2 id="modalTitle">模块详情</h2>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 模块详情将在这里动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let modulesData = {};
        let filteredModules = [];

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadModuleData();
            setupEventListeners();
        });

        // 加载模块数据
        async function loadModuleData() {
            try {
                const response = await fetch('module_labs.json');
                if (!response.ok) {
                    throw new Error('Failed to load module data');
                }

                modulesData = await response.json();
                filteredModules = Object.values(modulesData);

                updateStats();
                renderModules();

                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error loading module data:', error);
                document.getElementById('loading').innerHTML = '❌ 加载失败，请刷新页面重试';
            }
        }

        // 设置事件监听器
        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', filterModules);
            document.getElementById('typeFilter').addEventListener('change', filterModules);
            document.getElementById('sortBy').addEventListener('change', sortModules);
        }

        // 更新统计数据
        function updateStats() {
            const modules = Object.values(modulesData);
            const originalCount = modules.filter(m => m.module_type === 'original').length;
            const supportCount = modules.filter(m => m.module_type === 'support').length;
            const totalDocs = modules.reduce((sum, m) => sum + m.related_documents.length, 0);

            document.getElementById('totalModules').textContent = modules.length;
            document.getElementById('originalModules').textContent = originalCount;
            document.getElementById('supportModules').textContent = supportCount;
            document.getElementById('totalDocs').textContent = totalDocs;
        }

        // 渲染模块卡片
        function renderModules() {
            const grid = document.getElementById('modulesGrid');
            const emptyState = document.getElementById('emptyState');

            if (filteredModules.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';

            grid.innerHTML = filteredModules.map(module => createModuleCard(module)).join('');
        }

        // 创建模块卡片HTML
        function createModuleCard(module) {
            const typeClass = `type-${module.module_type}`;
            const typeText = getTypeText(module.module_type);

            return `
                <div class="module-card" onclick="showModuleDetails('${module.module_id}')">
                    <div class="module-header">
                        <div>
                            <div class="module-title">${module.module_name}</div>
                            <div class="module-id">${module.module_id}</div>
                        </div>
                        <div class="module-type ${typeClass}">${typeText}</div>
                    </div>

                    <div class="module-stats">
                        <div class="module-stat">
                            <span class="icon">📚</span>
                            <span>${module.learning_objectives.length} 学习目标</span>
                        </div>
                        <div class="module-stat">
                            <span class="icon">🔬</span>
                            <span>${module.lab_exercises.length} 实验练习</span>
                        </div>
                        <div class="module-stat">
                            <span class="icon">📄</span>
                            <span>${module.related_documents.length} 相关文档</span>
                        </div>
                        <div class="module-stat">
                            <span class="icon">🧪</span>
                            <span>${module.compliance_items.length} 合规检查</span>
                        </div>
                    </div>

                    <div class="module-content">
                        ${module.related_documents.length > 0 ? `
                        <div class="content-section">
                            <div class="content-title">相关文档</div>
                            <ul class="content-list">
                                ${module.related_documents.slice(0, 3).map(doc =>
                                    `<li>${doc.split('\\').pop()}</li>`
                                ).join('')}
                                ${module.related_documents.length > 3 ? `<li>... 还有 ${module.related_documents.length - 3} 个文档</li>` : ''}
                            </ul>
                        </div>
                        ` : ''}

                        ${module.source_code_files.length > 0 ? `
                        <div class="content-section">
                            <div class="content-title">源代码文件</div>
                            <ul class="content-list">
                                ${module.source_code_files.slice(0, 3).map(file =>
                                    `<li>${file.split('/').pop()}</li>`
                                ).join('')}
                                ${module.source_code_files.length > 3 ? `<li>... 还有 ${module.source_code_files.length - 3} 个文件</li>` : ''}
                            </ul>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // 获取类型文本
        function getTypeText(type) {
            const typeMap = {
                'original': '原始P模块',
                'new': '重构模块',
                'support': '支撑模块',
                'project': '项目模块',
                'archived': '已归档'
            };
            return typeMap[type] || type;
        }

        // 筛选模块
        function filterModules() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('typeFilter').value;

            filteredModules = Object.values(modulesData).filter(module => {
                const matchesSearch = module.module_name.toLowerCase().includes(searchTerm) ||
                                    module.module_id.toLowerCase().includes(searchTerm);
                const matchesType = !typeFilter || module.module_type === typeFilter;

                return matchesSearch && matchesType;
            });

            sortModules();
        }

        // 排序模块
        function sortModules() {
            const sortBy = document.getElementById('sortBy').value;

            filteredModules.sort((a, b) => {
                switch (sortBy) {
                    case 'name':
                        return a.module_name.localeCompare(b.module_name);
                    case 'id':
                        return a.module_id.localeCompare(b.module_id);
                    case 'docs':
                        return b.related_documents.length - a.related_documents.length;
                    default:
                        return 0;
                }
            });

            renderModules();
        }

        // 显示模块详情
        function showModuleDetails(moduleId) {
            const module = modulesData[moduleId];
            if (!module) return;

            const modal = document.getElementById('moduleModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = module.module_name;

            modalBody.innerHTML = `
                <div class="section">
                    <div class="section-title">
                        <span>📋</span> 模块信息
                    </div>
                    <p><strong>模块ID:</strong> ${module.module_id}</p>
                    <p><strong>模块类型:</strong> ${getTypeText(module.module_type)}</p>
                </div>

                ${module.learning_objectives.length > 0 ? `
                <div class="section">
                    <div class="section-title">
                        <span>🎯</span> 学习目标 (${module.learning_objectives.length})
                    </div>
                    ${module.learning_objectives.map(obj => `
                        <div class="objective-card">
                            <div class="objective-title">${obj.title}</div>
                            <p>${obj.description}</p>
                            <p><strong>预计时间:</strong> ${obj.estimated_time}</p>
                            <p><strong>前置条件:</strong> ${obj.prerequisites.join(', ')}</p>
                            <p><strong>预期成果:</strong> ${obj.expected_outcomes.join(', ')}</p>
                        </div>
                    `).join('')}
                </div>
                ` : ''}

                ${module.lab_exercises.length > 0 ? `
                <div class="section">
                    <div class="section-title">
                        <span>🔬</span> 实验练习 (${module.lab_exercises.length})
                    </div>
                    ${module.lab_exercises.map(exercise => `
                        <div class="exercise-card">
                            <div class="exercise-title">${exercise.title}</div>
                            <div class="exercise-difficulty difficulty-${exercise.difficulty}">${getDifficultyText(exercise.difficulty)}</div>
                            <p>${exercise.description}</p>
                            <p><strong>预计时间:</strong> ${exercise.estimated_time || '未指定'}</p>
                            <p><strong>前置条件:</strong> ${exercise.prerequisites ? exercise.prerequisites.join(', ') : '无'}</p>
                            <p><strong>预期成果:</strong> ${exercise.expected_outcomes ? exercise.expected_outcomes.join(', ') : '未指定'}</p>
                        </div>
                    `).join('')}
                </div>
                ` : ''}

                ${module.related_documents.length > 0 ? `
                <div class="section">
                    <div class="section-title">
                        <span>📄</span> 相关文档 (${module.related_documents.length})
                    </div>
                    <ul class="content-list">
                        ${module.related_documents.map(doc => `<li>${doc}</li>`).join('')}
                    </ul>
                </div>
                ` : ''}

                ${module.source_code_files.length > 0 ? `
                <div class="section">
                    <div class="section-title">
                        <span>💻</span> 源代码文件 (${module.source_code_files.length})
                    </div>
                    <ul class="content-list">
                        ${module.source_code_files.map(file => `<li>${file}</li>`).join('')}
                    </ul>
                </div>
                ` : ''}

                ${module.test_files.length > 0 ? `
                <div class="section">
                    <div class="section-title">
                        <span>🧪</span> 测试文件 (${module.test_files.length})
                    </div>
                    <ul class="content-list">
                        ${module.test_files.map(file => `<li>${file}</li>`).join('')}
                    </ul>
                </div>
                ` : ''}

                ${module.compliance_items.length > 0 ? `
                <div class="section">
                    <div class="section-title">
                        <span>✅</span> 合规检查项 (${module.compliance_items.length})
                    </div>
                    <ul class="content-list">
                        ${module.compliance_items.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                </div>
                ` : ''}
            `;

            modal.style.display = 'block';
        }

        // 获取难度文本
        function getDifficultyText(difficulty) {
            const difficultyMap = {
                'beginner': '初级',
                'intermediate': '中级',
                'advanced': '高级'
            };
            return difficultyMap[difficulty] || difficulty;
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('moduleModal').style.display = 'none';
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('moduleModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // ESC键关闭模态框
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
